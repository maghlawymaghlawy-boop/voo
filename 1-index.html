<style>
:root{--y:#ffd400;--k:#0b0b0b;--g:#6b6b6b;--l:#f4f4f2;--b:#e6e6e2;--r:#d83a3a;--ok:#1e9e5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#e9e9e6;font-family:"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,Arial,sans-serif;color:var(--k)}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#fff;position:relative;display:flex;flex-direction:column}
main{flex:1;padding:18px 18px 96px}
h1{font-size:26px;margin:8px 0 6px;line-height:1.35}h2{font-size:20px;margin:18px 0 10px}h3{margin:0;font-size:16px}
p{margin:0;color:var(--g);line-height:1.7;font-size:14px}.sm{font-size:12px;color:var(--g)}
.btn{display:block;width:100%;border:2px solid var(--k);background:#fff;color:var(--k);font:inherit;font-weight:700;font-size:17px;padding:15px;border-radius:14px;cursor:pointer;text-align:center;margin-top:12px}
.btn.y{background:var(--y);border-color:var(--y)}.btn.k{background:var(--k);color:#fff}.btn.sm2{padding:10px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}.btn.red{border-color:var(--r);color:var(--r)}
label{display:block;font-weight:700;margin:16px 0 8px;font-size:15px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:14px;border:1.5px solid var(--b);background:var(--l);border-radius:14px;outline:none}
input:focus,textarea:focus{border-color:var(--k);background:#fff}
.card{border:1.5px solid var(--b);border-radius:18px;padding:14px;margin:10px 0;background:#fff}
.card.sel{border-color:var(--k)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;background:var(--k);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.pill.y{background:var(--y);color:var(--k)}.pill.w{background:#fff3c4;color:#6a5600}.pill.r{background:#fde4e4;color:var(--r)}.pill.g{background:#dff5e8;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{border:1.5px solid var(--b);border-radius:16px;text-align:center;padding:14px 4px}.stat b{font-size:26px;display:block}.stat span{font-size:12px;color:var(--g)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--b);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav a{flex:1;text-align:center;font-size:12px;color:var(--g);padding:6px;font-weight:700;cursor:pointer}nav a.on{color:var(--k)}nav a i{display:block;font-style:normal;font-size:20px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg div{flex:1;min-width:70px;text-align:center;padding:13px 6px;border:1.5px solid var(--b);border-radius:14px;font-weight:700;cursor:pointer}.seg div.on{background:var(--k);color:#fff;border-color:var(--k)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.toggle{background:var(--k);color:#fff;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer}
.sw{width:46px;height:26px;border-radius:99px;background:#555;position:relative}.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--y)}.sw.on::after{right:23px}
.dark{background:var(--k);color:#fff;border-radius:20px;padding:22px;text-align:center}.dark b{display:block;color:var(--y);font-size:40px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--b);font-size:14px}.kv:last-child{border:0}.kv span{color:var(--g);white-space:nowrap}.kv b{text-align:left}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:#fff;width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:20px}
.map{height:200px;border-radius:18px;background:#eef0ea;position:relative;overflow:hidden;border:1.5px solid var(--b)}
.err{color:var(--r);font-size:13px;margin-top:8px;min-height:18px}.note{background:#fff8d6;border:1.5px solid #f0e08a;border-radius:14px;padding:12px;font-size:13px;margin:12px 0;color:#5a4b00}
.hero{text-align:center;padding-top:10px}.hero img{width:210px}.feat{display:flex;gap:12px;align-items:center}.feat i{width:42px;height:42px;border-radius:12px;background:var(--y);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;flex:none}
.stars{color:#e0a800;letter-spacing:2px}.star{font-size:34px;color:#ccc;cursor:pointer}.star.on{color:#e0a800}
.demo{font-size:12px;color:var(--g);background:var(--l);border-radius:12px;padding:10px;margin-top:14px;line-height:1.8}
#splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;align-items:center;justify-content:center;transition:opacity .5s}#splash img{width:240px}
.mini{padding:9px 12px;margin:7px 0;border-radius:14px}.mini .row{gap:8px}.mini b.id{font-size:14px;white-space:nowrap}.mini .ln{font-size:12.5px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;line-height:1.5}.mini .pill{font-size:11px;padding:3px 9px}
.geo{border:1.5px solid var(--b);border-radius:18px;overflow:hidden;margin:10px 0}.geo iframe{width:100%;height:210px;border:0;display:block}.geo .inf{padding:10px 12px;font-size:12.5px;color:var(--g);line-height:1.8}

let T=localStorage.getItem('voo.token')||null;
let S={me:null,orders:[],off:0};
let _jwt=null,_jwtExp=0;
async function anonToken(){
  if(!VOO.AUTH)return VOO.KEY||'';
  if(_jwt&&Date.now()<_jwtExp-60000)return _jwt;
  const r=await fetch(VOO.AUTH+'/token/anonymous');if(!r.ok)throw new Error('مفيش اتصال، جرّب تاني');
  const j=await r.json();_jwt=j.token;_jwtExp=j.expires_at*1000;return _jwt}
async function rpc(fn,args){
  let r;try{const tk=await anonToken();
  r=await fetch(VOO.API+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},tk?{Authorization:'Bearer '+tk}:{},VOO.KEY?{apikey:VOO.KEY}:{}),body:JSON.stringify(args||{})})}catch(e){throw new Error('مفيش اتصال، جرّب تاني')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(j.message||'').trim();const e=new Error(ERR[m]||(m?'حصلت مشكلة: '+m:'مفيش اتصال، جرّب تاني'));e.code=m;throw e}
  return j}
async function refresh(){
  if(!T){S.me=null;S.orders=[];return}
  try{const j=await rpc('api_state',{p_token:T});S.me=j.me;S.orders=j.orders;S.off=j.now-Date.now()}
  catch(e){if(e.code=='not_logged_in'){T=null;localStorage.removeItem('voo.token');S.me=null}}}
const now=()=>Date.now()+S.off;

function pickSeg(e){e.parentNode.querySelectorAll('div').forEach(d=>d.classList.remove('on'));e.classList.add('on');if(e.dataset.v&&e.parentNode.id=='vs'){const l=$('#vnl');if(l)l.textContent={moto:'رقم الماكينة',car:'رقم اللوحة (الملاكي)',truck:'رقم اللوحة (النقل)'}[e.dataset.v]}}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),fr=new FileReader();fr.onload=()=>{img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};img.onerror=()=>rej(new Error('الصورة مش مقروءة'));img.src=fr.result};fr.readAsDataURL(file)})}
async function doReg(t){const er=$('#er'),nm=$('#nm').value.trim(),ph=normPh($('#ph').value),pw=$('#pw').value;
 if(!nm)return er.textContent='اكتب الاسم';if(!/^01\d{9}$/.test(ph))return er.textContent=ERR.bad_phone;if(pw.length<4)return er.textContent=ERR.weak_password;
 const a={p_role:t,p_name:nm,p_phone:ph,p_pw:pw};
 if(t=='courier'){const f=['d1','d2','d3'].map(i=>$('#'+i).files[0]);if(f.some(x=>!x))return er.textContent=ERR.docs_required;
  const vn=$('#vn').value.trim(),vm=$('#vm').value.trim(),vf=['v1','v2'].map(i=>$('#'+i).files[0]);if(!vn)return er.textContent=ERR.vnum_required;if(!vm)return er.textContent=ERR.vmodel_required;if(vf.some(x=>!x))return er.textContent=ERR.vphotos_required;a.p_vnum=vn;a.p_vmodel=vm;
  er.textContent='بنجهّز الصور...';try{a.p_docs=await Promise.all(f.map(x=>shrink(x)));a.p_vphotos=await Promise.all(vf.map(x=>shrink(x)))}catch(e){return er.textContent=e.message}a.p_veh=document.querySelector('#vs .on').dataset.v}
 else a.p_addr=$('#ad').value.trim();
 er.textContent='';authed('api_register',a)}
async function logout(){try{await rpc('api_logout',{p_token:T})}catch(e){}T=null;localStorage.removeItem('voo.token');S={me:null,orders:[],off:0};go('landing')}

let G={on:false,id:null,last:0,pos:null,err:''};
function startGeo(){if(G.on||!navigator.geolocation){if(!navigator.geolocation)G.err='الجهاز مش داعم GPS';return}
 G.on=true;G.id=navigator.geolocation.watchPosition(p=>{G.err='';G.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};const t=Date.now();if(T&&t-G.last>10000){G.last=t;rpc('api_loc',{p_token:T,p_lat:G.pos.lat,p_lng:G.pos.lng,p_acc:G.pos.acc}).catch(()=>{})}},e=>{G.on=false;G.err=e.code==1?'اسمح للموقع من إعدادات المتصفح عشان GPS يشتغل':'مش قادر أجيب الموقع، اتأكد إن GPS شغال';navigator.geolocation.clearWatch(G.id);const f=document.activeElement;if(!(f&&/INPUT|TEXTAREA/.test(f.tagName)))render()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
const ago=at=>{const s=Math.max(0,Math.round((now()-at)/1000));return s<60?n(s)+' ثانية':n(Math.round(s/60))+' دقيقة'};
function geoBlock(l,title){if(!l)return `<div class="geo"><div class="inf"><b>${title}</b><br>لسه مفيش موقع مباشر. لازم صاحب الموقع يفتح التطبيق ويسمح بالـGPS.</div></div>`;
 const d=0.004,u=`https://www.openstreetmap.org/export/embed.html?bbox=${l.lng-d},${l.lat-d},${l.lng+d},${l.lat+d}&layer=mapnik&marker=${l.lat},${l.lng}`;
 return `<div class="geo"><iframe loading="lazy" src="${u}"></iframe><div class="inf"><b>${title}</b> · الدقة ±${n(Math.round(l.acc||0))} متر · آخر تحديث من ${ago(l.at)}<br><a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank">افتح في خرائط جوجل</a></div></div>`}
function waLink(o){const c=o.courier;const m=`أهلاً ${o.cname}، طلبك من ${o.shop.name} في الطريق مع المندوب ${c.name} (${c.phone}).\nكود التسليم: ${o.code}\nقول الكود للمندوب وقت الاستلام بس.`;return 'https://wa.me/20'+o.cphone.slice(1)+'?text='+encodeURIComponent(m)}
function handoff(id){const o=OID(id);const w=window.open(waLink(o),'_blank');act('api_handoff',{p_id:id})}
// maps
function mapBlock(mode,id){return `<div class="lmap" id="lm" data-mode="${mode}" data-oid="${id}"></div><div class="sm" id="lmi" style="margin-bottom:8px">بنجهّز الخريطة...</div>`}
let GC=JSON.parse(localStorage.getItem('voo.gc')||'{}'),gcLast=0,LMAP=null,LTOK=0;
async function geocode(addr,near){const k=addr.trim();if(GC[k])return GC[k];
 const w=Math.max(0,1100-(Date.now()-gcLast));if(w)await new Promise(r=>setTimeout(r,w));gcLast=Date.now();
 const vb=near?`&viewbox=${near.lng-.4},${near.lat+.4},${near.lng+.4},${near.lat-.4}`:'';
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=eg&accept-language=ar'+vb+'&q='+encodeURIComponent(k));const j=await r.json();
  if(j[0]){GC[k]={lat:+j[0].lat,lng:+j[0].lon};localStorage.setItem('voo.gc',JSON.stringify(GC));return GC[k]}}catch(e){}return null}
const ico=(t,c)=>L.divIcon({className:'',html:`<div class="lbl ${c||''}">${t}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
async function initMaps(){const el=document.getElementById('lm');if(!el)return;if(!window.L){setTimeout(initMaps,800);return}
 const tok=++LTOK,mode=el.dataset.mode;let from=null,tg=[];
 if(mode=='shop'){const o=OID(el.dataset.oid);if(!o)return;from=o.cloc;tg=[o]}
 else if(mode=='one'){const o=OID(el.dataset.oid);if(!o)return;from=G.pos;tg=[o]}
 else{from=G.pos;tg=active()}
 const inf=document.getElementById('lmi');
 if(LMAP){LMAP.remove();LMAP=null}
 const m=LMAP=L.map(el).setView(from?[from.lat,from.lng]:[31.42,31.81],14);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
 const pts=[],miss=[];
 for(const o of tg){const g=await geocode(o.address,from);if(tok!=LTOK)return;if(g)pts.push(Object.assign({o},g));else miss.push(o.address)}
 const bounds=[];
 if(from){L.marker([from.lat,from.lng],{icon:ico('أنا','c')}).addTo(m).bindTooltip(mode=='shop'?'المندوب':'موقعك الحالي');bounds.push([from.lat,from.lng])}
 let txt='';
 if(from&&pts.length){
  try{let url,ord=pts;
   if(pts.length==1)url=`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${pts[0].lng},${pts[0].lat}?overview=full&geometries=geojson`;
   else url=`https://router.project-osrm.org/trip/v1/driving/${from.lng},${from.lat};${pts.map(p=>p.lng+','+p.lat).join(';')}?source=first&roundtrip=false&destination=any&overview=full&geometries=geojson`;
   const j=await (await fetch(url)).json();if(tok!=LTOK)return;
   if(pts.length>1){ord=pts.map((p,i)=>({p,w:j.waypoints[i+1].waypoint_index})).sort((a,b)=>a.w-b.w).map(x=>x.p);const t=j.trips[0];txt=`المسافة ${n((t.distance/1000).toFixed(1))} كم · حوالي ${n(Math.round(t.duration/60))} دقيقة`;L.geoJSON(t.geometry,{style:{color:'#0b0b0b',weight:5}}).addTo(m)}
   else{const t=j.routes[0];txt=`المسافة ${n((t.distance/1000).toFixed(1))} كم · حوالي ${n(Math.round(t.duration/60))} دقيقة`;L.geoJSON(t.geometry,{style:{color:'#0b0b0b',weight:5}}).addTo(m)}
   ord.forEach((p,i)=>{L.marker([p.lat,p.lng],{icon:ico(n(i+1))}).addTo(m).bindTooltip(`${p.o.cname||''} · ${p.o.address}`);bounds.push([p.lat,p.lng])});
   if(pts.length>1)txt+='<br>الترتيب: '+ord.map((p,i)=>`${n(i+1)}) ${esc(p.o.cname||'أوردر #'+p.o.id)}`).join(' ← ');
  }catch(e){pts.forEach((p,i)=>{L.marker([p.lat,p.lng],{icon:ico(n(i+1))}).addTo(m);bounds.push([p.lat,p.lng])});txt='مقدرتش أرسم خط السير دلوقتي'}
 }else{pts.forEach((p,i)=>{L.marker([p.lat,p.lng],{icon:ico(n(i+1))}).addTo(m).bindTooltip(p.o.address);bounds.push([p.lat,p.lng])});
  if(!from)txt=mode=='shop'?'لسه مفيش موقع مباشر للمندوب (لازم يفتح التطبيق ويسمح بالـGPS).':'موقعك لسه مش متحدد. اسمح للموقع وانتظر ثواني.'}
 if(from&&from.acc)txt+=(txt?'<br>':'')+`دقة الموقع ±${n(Math.round(from.acc))} متر`+(from.at?` · آخر تحديث من ${ago(from.at)}`:'');
 if(miss.length)txt+=(txt?'<br>':'')+'مش لاقي العنوان ده على الخريطة: '+miss.map(esc).join('، ');
 if(bounds.length)m.fitBounds(bounds,{padding:[30,30],maxZoom:17});
 if(inf)inf.innerHTML=txt}
setInterval(()=>{if(document.getElementById('lm')&&!document.hidden)initMaps()},20000);

function shopView(a,r){const u=me();const mine=S.orders;
 const head=`<div class="top"><div><h2 style="margin:0">${esc(u.name)}</h2><p class="sm">${esc(u.addr||'')}</p></div><span class="pill">محل</span></div>`;
 if(!a){const act=mine.filter(o=>['open','matched','picked'].includes(o.status));const today=mine.filter(o=>now()-o.created_at<864e5).length;
  return head+`<div class="stats"><div class="stat"><b>${n(today)}</b><span>أوردرات النهارده</span></div><div class="stat"><b>${n(mine.filter(o=>['matched','picked'].includes(o.status)).length)}</b><span>قيد التنفيذ</span></div><div class="stat"><b>${n(mine.filter(o=>o.status=='open').length)}</b><span>بيستنى عروض</span></div></div>
  <button class="btn y" onclick="go('shop/new')">+ ارفع أوردر جديد</button><h2>${act.length?'أوردرات نشطة دلوقتي':'مفيش أوردرات نشطة'}</h2>${act.map(orderCardShop).join('')}`}
 if(a=='new'){return head+`<label>اسم العميل</label><input id="ocn" value="${esc(form.ocn||'')}"><label>موبايل العميل</label><input id="ocp" inputmode="numeric" dir="ltr" style="text-align:right" placeholder="01xxxxxxxxx" value="${esc(form.ocp||'')}"><p class="sm" style="margin-top:6px">هيظهر للمندوب اللي يكسب الأوردر، وبيوصله كود التسليم على واتساب.</p><label>عنوان العميل</label><input id="oa" value="${esc(form.oa||'')}"><label>تفاصيل الأوردر</label><textarea id="od" rows="2">${esc(form.od||'')}</textarea>
  <label>السعر اللي يناسبك</label><div class="row"><span style="font-weight:700">جنيه</span><input id="op" inputmode="numeric" style="flex:1" value="${esc(form.op||'')}"></div><p class="sm" style="margin-top:6px">مخفي عن المناديب. أول عرض بالسعر ده أو أقل يكسب.</p>
  <label>المركبة المطلوبة</label><div class="seg" id="ov"><div class="on" data-v="any" onclick="pickSeg(this)">أي مركبة</div>${Object.entries(VEH).map(([k,v])=>`<div data-v="${k}" onclick="pickSeg(this)">${v}</div>`).join('')}</div>
  <label>طريقة الدفع</label><div class="seg" id="opay"><div class="on" data-v="كاش" onclick="pickSeg(this)">كاش</div><div data-v="إلكتروني" onclick="pickSeg(this)">إلكتروني</div></div><p class="sm" style="margin-top:6px">الدفع بينك وبين المندوب مباشرة. voo مش طرف في الفلوس.</p>
  <div class="err" id="er"></div><button class="btn y" onclick="newOrder()">ارفع الأوردر</button>`}
 if(a=='orders')return head+`<h2>أوردراتي</h2>${mine.length?mine.map(orderCardShop).join(''):'<p>لسه مرفعتش أوردرات.</p>'}`;
 if(a=='me'){const d=mine.filter(o=>o.status=='delivered');return head+`<h2>حسابي</h2><div class="card"><div class="kv"><span>الموبايل</span><b>${u.phone}</b></div><div class="kv"><span>العنوان</span><b>${esc(u.addr||'')}</b></div><div class="kv"><span>أوردرات اتسلمت</span><b>${n(d.length)}</b></div><div class="kv"><span>إجمالي مصاريف التوصيل</span><b>${money(d.reduce((s,o)=>s+o.bid,0))}</b></div></div><h2>السجل</h2>${mine.filter(o=>['delivered','failed','expired'].includes(o.status)).map(orderCardShop).join('')||'<p>مفيش سجل لسه.</p>'}<button class="btn" onclick="logout()">تسجيل الخروج</button>`}
 if(a=='o'){const o=OID(r.split('/')[2]);if(!o)return head+'<p>الأوردر مش موجود</p><button class="btn" onclick="go(\'shop\')">رجوع</button>';return head+shopOrder(o)}
 return head}
function orderCardShop(o){const st=STAT[o.status];return `<div class="card mini" onclick="go('shop/o/${o.id}')"><div class="row"><b class="id">أوردر #${n(o.id)}</b><span class="pill ${st[1]}">${st[0]}</span></div><div class="ln">${esc(o.cname||'')} · ${esc(o.address)}</div><div class="ln">${o.courier?`${esc(o.courier.name)} · ${money(o.bid)}`:o.status=='open'?`باقي <b data-exp="${o.expires_at}">${fmt((o.expires_at-now())/1000)}</b>`:esc(o.details)}</div></div>`}
function newOrder(){const ocn=$('#ocn').value.trim(),ocp=normPh($('#ocp').value),oa=$('#oa').value.trim(),od=$('#od').value.trim(),op=parseInt(normPh($('#op').value));
 form={oa,od,ocn,ocp,op:op||''};if(!ocn)return $('#er').textContent=ERR.cname_required;if(!/^01\d{9}$/.test(ocp))return $('#er').textContent=ERR.bad_cphone;if(!oa||!od||!op||op<=0)return $('#er').textContent=ERR.missing_fields;
 act('api_new_order',{p_cname:ocn,p_cphone:ocp,p_address:oa,p_details:od,p_price:op,p_pay:document.querySelector('#opay .on').dataset.v,p_vehicle:document.querySelector('#ov .on').dataset.v},id=>{form={};go('shop/o/'+id)})}
function shopOrder(o){let h=`<div class="row" style="margin-top:14px">${pill(o)}<h2 style="margin:0">أوردر #${n(o.id)}</h2></div>`;
 if(o.status=='open')h+=`<div class="dark" style="margin-top:14px">الأوردر وصل للمناديب القريبين<b data-exp="${o.expires_at}">${fmt((o.expires_at-now())/1000)}</b></div><p style="margin-top:10px">سعرك ${money(o.price)} (مخفي). أول مندوب يقدم عرض بالسعر ده أو أقل هيتقبل أوتوماتيك. عروض أعلى مبتتقبلش.</p><p class="sm" style="margin-top:6px">عروض اتقدمت ورفضها النظام: ${n(o.rejected_bids)}</p>`;
 if(o.status=='expired')h+=`<div class="card" style="margin-top:14px"><p>محدش قدّم عرض في الوقت. عدّل السعر وارفعه تاني.</p><label>السعر الجديد</label><input id="np" inputmode="numeric" value="${o.price+2}"><div class="err" id="er"></div><button class="btn y" onclick="republish(${o.id})">ارفع تاني</button></div>`;
 if(o.courier){const c=o.courier;h+=`<div class="card" style="margin-top:14px"><div class="row"><h3>${esc(c.name)}</h3><span class="stars">${'★'.repeat(Math.round(c.rating))}</span></div><p>${VEH[c.veh]} · ${esc(c.vmodel||'')} · رقم ${esc(c.vnum||'')}</p><p>${c.phone} · تقييم ${n(c.rating)}</p><p style="margin-top:6px">اتفقتوا على <b>${money(o.bid)}</b> · الدفع ${o.pay}</p><a class="btn sm2" href="tel:${c.phone}">اتصل بالمندوب</a></div>`;
  if(o.status=='matched')h+=mapBlock('shop',o.id)+`<button class="btn y" onclick="handoff(${o.id})">تسليم للمندوب</button><p class="sm" style="margin-top:6px">اضغط لما المندوب يستلم الأوردر. هيفتح واتساب برسالة جاهزة للعميل فيها كود التسليم.</p>`;
  if(o.status=='picked')h+=mapBlock('shop',o.id)+`<a class="btn k sm2" href="${waLink(o)}" target="_blank">ابعت الكود للعميل على واتساب</a><div class="card"><p>كود التسليم (العميل بيقوله للمندوب):</p><div style="font-size:34px;font-weight:800;letter-spacing:8px;text-align:center">${n(o.code)}</div></div>`;
  if(o.status=='delivered'){h+=`<div class="note" style="background:#e6f7ed;border-color:#b5e3c8;color:#14693b">اتسلّم بنجاح</div>`;
   h+=o.rated?`<p>قيّمت المندوب ${n(o.rated)} من ٥</p>`:`<h3>قيّم المندوب</h3><div style="text-align:center">${[1,2,3,4,5].map(i=>`<span class="star" onclick="act('api_rate',{p_id:${o.id},p_stars:${i}})">★</span>`).join('')}</div>`}
  if(o.status=='failed')h+=`<div class="note">فشل التسليم: ${esc(o.reason||'')}</div>`}
 h+=`<div class="card" style="margin-top:14px"><div class="kv"><span>العميل</span><b>${esc(o.cname||'')} · ${esc(o.cphone||'')}</b></div><div class="kv"><span>العنوان</span><b>${esc(o.address)}</b></div><div class="kv"><span>الطلب</span><b>${esc(o.details)}</b></div><div class="kv"><span>المركبة</span><b>${o.vehicle=='any'?'أي مركبة':VEH[o.vehicle]}</b></div></div>`;
 return h+`<button class="btn" onclick="history.back()">رجوع</button>`}
function republish(id){const p=parseInt(normPh($('#np').value));if(!p)return;act('api_republish',{p_id:id,p_price:p})}
// courier
function courView(a,r){const c=me();const lim=c.limit,act_=active();
 const head=`<div class="top"><div><h2 style="margin:0">أهلاً كابتن ${esc(c.name)}</h2><p class="sm">${VEH[c.veh]}</p></div>${act_.length?'<span class="pill y">أوردر نشط</span>':''}</div>`;
 if(c.status!='approved'&&a!='me')return head+`<div class="card" style="margin-top:16px;text-align:center;padding:26px"><div style="font-size:40px">⏳</div><h2>طلبك قيد المراجعة</h2><p>بنراجع أوراقك. هتقدر تقدم عروض أول ما نعتمد حسابك.</p></div><button class="btn" onclick="refreshNow()">حدّث الحالة</button><button class="btn" onclick="go('cour/me')">حسابي</button>`;
 if(!a){const full=act_.length>=lim;const list=S.orders.filter(o=>o.status=='open').sort((x,y)=>x.expires_at-y.expires_at);
  return head+`<div class="toggle" style="margin:14px 0" onclick="act('api_toggle_online',{})"><span>${c.online?'متاح - voo شغال':'مش متاح'}</span><div class="sw ${c.online?'on':''}"></div></div>
  ${act_.length?`<button class="btn k" onclick="go('cour/trip')">عرض خط سير الرحلة</button>`:''}
  ${act_.length?`<h2>أوردراتك النشطة (${n(act_.length)} من ${n(lim)})</h2>${act_.map(orderCardCour).join('')}`:''}
  <div class="row"><h2>أوردرات قريبة منك</h2><span class="pill y">تقدر تاخد ${n(lim)} أوردر</span></div>
  ${!c.online?'<p>شغّل زرار متاح عشان تشوف الأوردرات.</p>':full?'<div class="note">وصلت للحد الأقصى من الأوردرات. خلّص واحد وبعدها قدّم على غيره.</div>':list.length?list.map(o=>`<div class="card" onclick="go('cour/o/${o.id}')"><div class="row"><span class="pill" data-exp="${o.expires_at}">${fmt((o.expires_at-now())/1000)}</span><h3>${esc(o.shop.name)}</h3></div><p>${esc(o.shop.addr||'')} ← ${esc(o.address)}</p><p class="sm">${esc(o.details)}</p></div>`).join(''):'<p>مفيش أوردرات دلوقتي. هتظهر هنا أول ما محل يرفع أوردر.</p>'}`}
 if(a=='o'){const o=OID(r.split('/')[2]);if(!o)return head+'<p>الأوردر ده لم يعد متاح.</p><button class="btn" onclick="go(\'cour\')">رجوع</button>';return head+courOrder(o,c,lim,act_)}
 if(a=='m'){const o=OID(r.split('/')[2]);return head+(o?`<h2>الطريق لعنوان العميل</h2>`+mapBlock('one',o.id)+`<div class="card"><div class="kv"><span>العميل</span><b>${esc(o.cname||'')}</b></div><div class="kv"><span>العنوان</span><b>${esc(o.address)}</b></div></div>`:'<p>الأوردر مش موجود</p>')+`<button class="btn" onclick="history.back()">رجوع</button>`}
 if(a=='trip')return head+`<h2>خط سير الرحلة</h2>`+(act_.length?mapBlock('trip',0):'<p>مفيش أوردرات نشطة.</p>')+`<button class="btn" onclick="go('cour')">رجوع</button>`;
 if(a=='mine'){const l=S.orders.filter(o=>o.courier);const d=l.filter(o=>o.status=='delivered');
  return head+`<div class="stats"><div class="stat"><b>${n(d.length)}</b><span>اتسلمت</span></div><div class="stat"><b>${n(d.reduce((s,o)=>s+o.bid,0))}</b><span>مكسبك (جنيه)</span></div><div class="stat"><b>${n(act_.length)}</b><span>نشطة</span></div></div><h2>أوردراتي</h2>${l.map(orderCardCour).join('')||'<p>لسه مفيش.</p>'}<p class="sm">المكسب بيتحصل مباشرة من المحل. voo مش بيمسك فلوس.</p>`}
 if(a=='me')return head+`<h2>حسابي</h2><div class="card"><div class="kv"><span>الحالة</span><b>${c.status=='approved'?'معتمد':'قيد المراجعة'}</b></div><div class="kv"><span>الموبايل</span><b>${c.phone}</b></div><div class="kv"><span>التقييم</span><b>${n(c.rating)} ★</b></div><div class="kv"><span>رحلات خلصت</span><b>${n(c.trips)}</b></div><div class="kv"><span>أقصى أوردرات في نفس الوقت</span><b>${n(lim)}</b></div></div><p class="sm">الحد بيزيد مع التقييم العالي وعدد الرحلات.</p><button class="btn" onclick="logout()">تسجيل الخروج</button>`;
 return head}
function orderCardCour(o){return `<div class="card" onclick="go('cour/o/${o.id}')"><div class="row">${pill(o)}<h3>${esc(o.shop.name)}</h3></div><p>${esc(o.shop.addr||'')} ← ${esc(o.address)}</p>${o.bid?`<p class="sm">عرضك ${money(o.bid)}</p>`:''}</div>`}
function courOrder(o,c,lim,act_){let h=`<div class="row" style="margin-top:14px">${pill(o)}<h2 style="margin:0">تفاصيل الأوردر</h2></div>`;
 const mineO=!!o.courier;
 if(o.status=='open')h+=`<div class="card sel row" style="margin-top:12px"><span class="pill" data-exp="${o.expires_at}">${fmt((o.expires_at-now())/1000)}</span><b>الوقت المتبقي</b></div>`;
 h+=`<div class="card"><div class="kv"><span>الاستلام</span><b>${esc(o.shop.name)} - ${esc(o.shop.addr||'')}</b></div>${o.cphone?`<div class="kv"><span>العميل</span><b>${esc(o.cname||'')} · <a href="tel:${o.cphone}">${o.cphone}</a></b></div>`:''}<div class="kv"><span>التسليم</span><b>${esc(o.address)}</b></div><div class="kv"><span>الطرد</span><b>${esc(o.details)}</b></div><div class="kv"><span>الدفع</span><b>${o.pay}</b></div></div>`;
 if(o.status=='open'){h+=act_.length>=lim?'<div class="note">وصلت للحد الأقصى من الأوردرات.</div>':`<button class="btn y" onclick="sheet=bidSheet(${o.id});render()">قدّم عرضك</button>`}
 if(mineO&&(o.status=='matched'||o.status=='picked'))h+=`<button class="btn k" onclick="go('cour/m/${o.id}')">عرض العنوان على الخريطة</button>`;
 if(mineO&&o.status=='matched')h+=`<div class="dark">كسبت الأوردر بـ<b>${money(o.bid)}</b></div><p style="margin-top:10px">روح المحل واستلم الأوردر. المحل هيأكد التسليم ليك.</p>${geoBlock(o.sloc,'موقع المحل')}<a class="btn" href="tel:${o.shop_phone}">اتصل بالمحل</a>`;
 if(mineO&&o.status=='picked')h+=`<div class="dark">في الطريق للعميل<b>${money(o.bid)}</b></div>${o.sloc?'':''}<label>كود التسليم من العميل (وصله على واتساب)</label><input id="cd" inputmode="numeric" maxlength="4" style="text-align:center;font-size:28px;letter-spacing:8px"><div class="err" id="er"></div><button class="btn y" onclick="act('api_deliver',{p_id:${o.id},p_code:normPh($('#cd').value)})">تأكيد التسليم</button><button class="btn red" onclick="sheet=failSheet(${o.id});render()">التسليم فشل</button>`;
 if(mineO&&o.status=='delivered')h+=`<div class="note" style="background:#e6f7ed;border-color:#b5e3c8;color:#14693b">اتسلّم. مستحق ${money(o.bid)} ${o.pay=='كاش'?'كاش من المحل':''}</div>`;
 if(mineO&&o.status=='failed')h+=`<div class="note">فشل التسليم: ${esc(o.reason||'')}</div>`;
 return h+`<button class="btn" onclick="history.back()">رجوع</button>`}
function bidSheet(id){const o=OID(id);return `<h2 style="margin-top:0">قدّم عرضك</h2><div class="row"><span class="pill" data-exp="${o.expires_at}">${fmt((o.expires_at-now())/1000)}</span><span>الوقت المتبقي</span></div><div class="row" style="margin-top:12px"><span style="font-weight:700">جنيه</span><input id="bd" inputmode="numeric" placeholder="حط عرضك" style="flex:1"></div><div class="err" id="er"></div><button class="btn y" onclick="doBid(${id})">أكّد عرضك</button><p class="sm" style="text-align:center;margin-top:8px">أول عرض بسعر المحل أو أقل يكسب فوراً</p>`}
function failSheet(id){return `<h2 style="margin-top:0">ليه التسليم فشل؟</h2><div class="seg" id="fr" style="flex-direction:column">${['العميل مش بيرد','العنوان غلط','العميل رفض الاستلام'].map((x,i)=>`<div class="${i?'':'on'}" onclick="pickSeg(this)">${x}</div>`).join('')}</div><button class="btn red" onclick="sheet=null;act('api_fail',{p_id:${id},p_reason:document.querySelector('#fr .on').textContent})">تأكيد</button>`}
async function doBid(id){const v=parseInt(normPh($('#bd').value));if(!v||v<=0)return $('#er').textContent='اكتب مبلغ صحيح';
 act('api_bid',{p_id:id,p_amount:v},r=>{if(r.won){sheet=null;go('cour/o/'+id)}else{render();sheet=bidSheet(id);render();$('#er').textContent='العرض أعلى من اللي المحل محدده. قدّم عرض أقل.'}})}
async function refreshNow(){await refresh();render()}
// live
setInterval(()=>{document.querySelectorAll('[data-exp]').forEach(e=>{e.textContent=fmt((e.dataset.exp-now())/1000)});
 },1000);
setInterval(async()=>{if(!T||busy||sheet||document.hidden)return;const f=document.activeElement;if(f&&/INPUT|TEXTAREA/.test(f.tagName))return;const before=JSON.stringify(S.orders)+JSON.stringify(S.me);await refresh();if(JSON.stringify(S.orders)+JSON.stringify(S.me)!==before||document.querySelector('[data-exp]')&&S.orders.some(o=>o.status=='open'&&o.expires_at<now()))render()},3000);
(async()=>{await refresh();if(S.me)startGeo();render();setTimeout(()=>{const s=$('#splash');s.style.opacity=0;setTimeout(()=>s.remove(),500)},1200)})();
</script></body></html>
