<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>voo - نموذج الخريطة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--k:#0b0b0b;--y:#ffd400;--g:#777}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
#m{position:absolute;inset:0}
.top{position:absolute;top:10px;left:10px;right:10px;z-index:500;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 4px 16px #0004;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:16px}.top span{color:var(--g);font-size:13px}
.tag{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:500;background:var(--k);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px}
.sh{position:relative;width:30px;height:30px}
.sh i{position:absolute;inset:0;border-radius:50%;background:var(--y);border:1.5px solid var(--k);display:block}
.sh b{position:absolute;top:-9px;right:-9px;min-width:19px;height:19px;border-radius:99px;background:var(--k);color:var(--y);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sh.on i{animation:gl 1.2s ease-in-out infinite}
.sh.off i{background:#c9c9c9;border-color:#555}
.sh.sel i{background:var(--k);border-color:var(--k)}
@keyframes gl{0%,100%{box-shadow:0 0 6px 2px rgba(255,212,0,.55)}50%{box-shadow:0 0 26px 14px rgba(255,212,0,.85)}}
.vme{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
#c{position:absolute;left:10px;right:10px;bottom:14px;z-index:600}
#c:not(:empty){background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 24px #0006;max-height:60vh;overflow:auto}
.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.h b{font-size:16px}
.x{font-size:20px;padding:0 6px;cursor:pointer}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eee;font-size:14px;cursor:pointer}.it span{color:var(--g)}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}.kv span{color:var(--g)}
.btn{display:block;width:100%;border:2px solid var(--k);background:#fff;border-radius:14px;padding:12px;font-size:15px;font-weight:700;margin-top:8px;font-family:inherit}.btn.y{background:var(--y)}
.pill{background:#fff8cc;border-radius:99px;padding:2px 10px;font-size:12px}
</style></head><body><div id="m"></div>
<div class="top"><span id="r">نطاق ٢ كم</span><b id="t">المحلات القريبة</b></div><div class="tag">نموذج تجريبي، مش التطبيق الحقيقي</div><div id="c"></div>
<script>
const AR='٠١٢٣٤٥٦٧٨٩',n=x=>String(x).replace(/\d/g,d=>AR[d]);
const ME=[31.4200,31.8100];
const SH=[
 {id:1,name:'حلواني النور',ll:[31.4235,31.8135],o:[{id:101,min:14,from:'حلواني النور',to:'شارع الجلاء',fee:25,val:250,km:1.6}]},
 {id:2,name:'مطعم السلام',ll:[31.4165,31.8065],o:[{id:102,min:21,from:'مطعم السلام',to:'الكورنيش',fee:30,val:180,km:2.4},{id:103,min:9,from:'مطعم السلام',to:'شارع النيل',fee:20,val:95,km:1.1},{id:104,min:3,from:'مطعم السلام',to:'ميدان الساعة',fee:25,val:310,km:1.9}]},
 {id:3,name:'صيدلية الشفاء',ll:[31.4215,31.8040],o:[],closed:1},
 {id:4,name:'سوبر ماركت الأمل',ll:[31.4140,31.8150],o:[]},
 {id:5,name:'مخبز الفرن',ll:[31.4260,31.8060],o:[],closed:1}
];
const m=L.map('m',{zoomControl:false}).setView(ME,14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
L.marker(ME,{icon:L.divIcon({className:'',html:'<div class="vme"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(m);
L.circle(ME,{radius:2000,color:'#2563eb',weight:2,dashArray:'6 6',fillOpacity:.04,interactive:false}).addTo(m);
const MK={};let sel=null;
function ic(s){const k=s.o.length;return L.divIcon({className:'',html:`<div class="sh ${s.closed?'off':k?'on':''}${sel==s.id?' sel':''}"><i></i>${k?`<b>${n(k)}</b>`:''}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}
function draw(){SH.forEach(s=>{if(!MK[s.id]){MK[s.id]=L.marker(s.ll,{icon:ic(s)}).addTo(m);MK[s.id].on('click',()=>tap(s.id))}else MK[s.id].setIcon(ic(s))});
 document.getElementById('t').textContent='المحلات القريبة'}
function close_(){sel=null;document.getElementById('c').innerHTML='';draw()}
function tap(id){sel=id;draw();const s=SH.find(x=>x.id==id),c=document.getElementById('c');
 if(!s.o.length){c.innerHTML=`<div class="h"><span class="x" onclick="close_()">✕</span><b>${s.name}</b></div><p style="color:#777;margin:4px 0">${s.closed?'المحل مقفول دلوقتي':'مفتوح ومفيش أوردرات دلوقتي'}</p>`;return}
 if(s.o.length==1)return det(s,s.o[0]);
 const l=[...s.o].sort((a,b)=>b.min-a.min);
 c.innerHTML=`<div class="h"><span class="x" onclick="close_()">✕</span><b>${s.name} · ${n(l.length)} أوردرات</b></div><div style="color:#777;font-size:12px">الأقدم الأول</div>`+l.map(o=>`<div class="it" onclick="det(SH[${SH.indexOf(s)}],SH[${SH.indexOf(s)}].o.find(z=>z.id==${o.id}))"><span>من ${n(o.min)} دقيقة</span><b>إلى ${o.to} · ${n(o.fee)} جنيه</b></div>`).join('')}
function det(s,o){document.getElementById('c').innerHTML=`<div class="h"><span class="x" onclick="${s.o.length>1?`tap(${s.id})`:'close_()'}">${s.o.length>1?'‹':'✕'}</span><b>أوردر من ${s.name}</b></div>
<div class="kv"><b>${n(o.fee)} جنيه</b><span>أجرة التوصيل</span></div><div class="kv"><b>${n(o.val)} جنيه</b><span>قيمة البضاعة</span></div><div class="kv"><b>${n(o.km)} كم</b><span>المسافة</span></div><div class="kv"><b>${o.to}</b><span>إلى</span></div><div class="kv"><span class="pill">من ${n(o.min)} دقيقة</span><span>الوقت</span></div>
<button class="btn y" onclick="alert('في التطبيق الحقيقي: بيفتح شاشة تفاصيل الأوردر وتقدّم عرضك')">قدّم عرضك</button>`}
draw();
</script></body></html>
