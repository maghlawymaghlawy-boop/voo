<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>voo - تجربة كارت العروض</title><style>
:root{--y:#ffd400;--k:#0b0b0b;--g:#6b6b6b;--l:#f4f4f2;--b:#e6e6e2;--r:#d83a3a;--ok:#1e9e5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#e9e9e6;font-family:"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,Arial,sans-serif;color:var(--k)}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#fff;position:relative;display:flex;flex-direction:column}
main{flex:1;padding:18px 18px 96px}
h1{font-size:26px;margin:8px 0 6px;line-height:1.35}h2{font-size:20px;margin:18px 0 10px}h3{margin:0;font-size:16px}
p{margin:0;color:var(--g);line-height:1.7;font-size:14px}.sm{font-size:12px;color:var(--g)}
.btn{display:block;width:100%;border:2px solid var(--k);background:#fff;color:var(--k);font:inherit;font-weight:700;font-size:17px;padding:15px;border-radius:14px;cursor:pointer;text-align:center;margin-top:12px}
.btn.y{background:var(--y);border-color:var(--y)}.btn.k{background:var(--k);color:#fff}.btn.sm2{padding:10px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}.btn.red{border-color:var(--r);color:var(--r)}
label{display:block;font-weight:700;margin:16px 0 8px;font-size:15px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:14px;border:1.5px solid var(--b);background:var(--l);border-radius:14px;outline:none}
input:focus,textarea:focus{border-color:var(--k);background:#fff}
.card{border:1.5px solid var(--b);border-radius:18px;padding:14px;margin:10px 0;background:#fff}
.card.sel{border-color:var(--k)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;background:var(--k);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.pill.y{background:var(--y);color:var(--k)}.pill.w{background:#fff3c4;color:#6a5600}.pill.r{background:#fde4e4;color:var(--r)}.pill.g{background:#dff5e8;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{border:1.5px solid var(--b);border-radius:16px;text-align:center;padding:14px 4px}.stat b{font-size:26px;display:block}.stat span{font-size:12px;color:var(--g)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--b);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav a{flex:1;text-align:center;font-size:12px;color:var(--g);padding:6px;font-weight:700;cursor:pointer}nav a.on{color:var(--k)}nav a i{display:block;font-style:normal;font-size:20px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg div{flex:1;min-width:70px;text-align:center;padding:13px 6px;border:1.5px solid var(--b);border-radius:14px;font-weight:700;cursor:pointer}.seg div.on{background:var(--k);color:#fff;border-color:var(--k)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.toggle{background:var(--k);color:#fff;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer}
.sw{width:46px;height:26px;border-radius:99px;background:#555;position:relative}.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--y)}.sw.on::after{right:23px}
.dark{background:var(--k);color:#fff;border-radius:20px;padding:22px;text-align:center}.dark b{display:block;color:var(--y);font-size:40px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--b);font-size:14px}.kv:last-child{border:0}.gv{background:#fff8d6;border:1.5px solid var(--y);border-radius:14px;padding:10px 12px;margin:8px 0;font-weight:700;font-size:14px}.kv.gv{border-radius:0;margin:0 -14px;padding:10px 14px;border-left:0;border-right:0}.kv.st{flex-wrap:wrap}.kv.st>span{white-space:normal;min-width:0}.kv.st>span:last-child{flex:1;text-align:left}.kv span{color:var(--g);white-space:nowrap}.kv b{text-align:left}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:#fff;width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:20px}
.map{height:200px;border-radius:18px;background:#eef0ea;position:relative;overflow:hidden;border:1.5px solid var(--b)}
.err{color:var(--r);font-size:13px;margin-top:8px;min-height:18px}.note{background:#fff8d6;border:1.5px solid #f0e08a;border-radius:14px;padding:12px;font-size:13px;margin:12px 0;color:#5a4b00}
.hero{text-align:center;padding-top:10px}.hero img{width:210px}.feat{display:flex;gap:12px;align-items:center}.feat i{width:42px;height:42px;border-radius:12px;background:var(--y);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;flex:none}
.stars{color:#e0a800;letter-spacing:2px}.star{font-size:34px;color:#ccc;cursor:pointer}.star.on{color:#e0a800}
.demo{font-size:12px;color:var(--g);background:var(--l);border-radius:12px;padding:10px;margin-top:14px;line-height:1.8}
#splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden}#splash #slg{position:relative;width:240px;max-width:70vw;will-change:transform;animation:vin .5s ease-out both}#splash #slg img{display:block}#splash #slg img.b{width:100%}#splash #slg img.wh{position:absolute;aspect-ratio:1;will-change:transform}#splash #slg img.sp{opacity:0}#splash #slg.go img.sp{animation:spk .85s cubic-bezier(.6,0,.9,.5) both}@keyframes spk{0%{opacity:0;transform:rotate(0)}8%{opacity:1}100%{opacity:1;transform:rotate(-720deg)}}#splash #slg.go{transition:transform .85s cubic-bezier(.6,0,.9,.5);transform:translateX(-130vw)}#hin{position:fixed;z-index:40;pointer-events:none;will-change:transform}#hin img{display:block;max-width:none}#hin img.b{width:100%}#hin img.wh{position:absolute;aspect-ratio:1}#hin img.sp{animation:spkr 1.1s cubic-bezier(.12,.6,.25,1) both}@keyframes spkr{0%{opacity:1;transform:rotate(0)}80%{opacity:1}100%{opacity:0;transform:rotate(540deg)}}@keyframes vin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.mini{padding:9px 12px;margin:7px 0;border-radius:14px}.mini .row{gap:8px}.mini b.id{font-size:14px;white-space:nowrap}.mini .ln{font-size:12.5px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;line-height:1.5}.mini .pill{font-size:11px;padding:3px 9px}
.geo{border:1.5px solid var(--b);border-radius:18px;overflow:hidden;margin:10px 0}.geo iframe{width:100%;height:210px;border:0;display:block}.geo .inf{padding:10px 12px;font-size:12.5px;color:var(--g);line-height:1.8}
.leaflet-marker-icon.sm{transition:transform 2.6s linear}.tr{display:flex;gap:8px;align-items:center}.lo{background:#d92d20;color:#fff;border:1.5px solid #b42318;border-radius:999px;padding:6px 12px;font:700 12px inherit;cursor:pointer}.lmap{height:340px;border-radius:18px;border:1.5px solid var(--b);margin:10px 0;z-index:0}.lbl{background:#0b0b0b;color:#ffd400;font-weight:800;border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;border:2px solid #fff;font-size:13px}.lbl.s{width:44px;border-radius:13px;background:#ffd400;color:#0b0b0b;border-color:#0b0b0b}.lbl.c{background:#ffd400;color:#0b0b0b;border-color:#0b0b0b}
.dueC{background:var(--k);color:#fff;border-radius:18px;padding:18px;margin:12px 0;cursor:pointer}.dueC small{color:#cfcfcf;font-size:13px}.dueC b{font-size:34px;display:block;margin:4px 0}.dueC .bar{height:10px;background:#444;border-radius:9px;overflow:hidden;margin:10px 0 4px}.dueC .bar i{display:block;height:100%;background:var(--y)}.dueC.dis{cursor:default}.stp{display:flex;gap:12px;align-items:flex-start;margin:11px 0;font-size:15px;line-height:1.6}.stp i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--y);font-style:normal;font-weight:800;text-align:center;line-height:28px}.amtb{background:#fff8cc;border:2px dashed var(--k);border-radius:14px;text-align:center;padding:12px;font-size:30px;font-weight:800;margin:8px 0}.rcp{width:100%;border-radius:14px;border:1.5px solid var(--b);margin:8px 0;max-height:60vh;object-fit:contain;background:#f4f4f4}.warn{background:#ffe9e9;border:1.5px solid #f2b3b3;border-radius:14px;padding:12px;font-size:14px;margin:12px 0;color:#7a1010;font-weight:700}.gm{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}.gm a{flex:1;min-width:150px;margin-top:0;text-decoration:none}
.authbox{width:100%}

body{background:#fff}main{max-width:430px;margin:auto;padding:14px 14px 80px;display:block}
.oc{border:3px solid #0b0b0b;border-radius:16px;overflow:hidden;margin:12px 0;background:#fff;transition:opacity .3s}
.oc.cmp{background:#fff8d6}
.oh{background:#0b0b0b;color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px}
.oh b{flex:1;font-size:16px}.oh .km{font-size:13px;font-weight:700;color:#ffd400}
.st{direction:ltr;display:inline-block;font-size:13px}.st i{font-style:normal;position:relative;display:inline-block;color:#6b6b6b}.st i u{text-decoration:none;position:absolute;right:0;top:0;overflow:hidden;color:#ffd400}
.ob{padding:10px 12px}.ob p{margin:0;color:#0b0b0b;font-size:13.5px}
.act{display:flex;align-items:center;gap:8px;margin-top:8px}
.bb{position:relative;overflow:hidden;flex:1;border:0;border-radius:14px;background:#e6b800;color:#0b0b0b;font:inherit;font-weight:700;font-size:16px;padding:14px;cursor:pointer}
.bb .f{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff0a6}.bb span{position:relative}
.cnt{min-width:50px;text-align:center;font-size:13px}
.rj{border:1.5px solid #b9b9b9;background:#fff;color:#6b6b6b;border-radius:10px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.sheet{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.sheet.on{display:flex}
.sheet>div{background:#fff;border-radius:22px 22px 0 0;padding:18px;width:100%;max-width:430px;margin:auto auto 0}
.demo{position:sticky;top:0;z-index:5;background:#fff8d6;border-bottom:1.5px solid #f0e08a;padding:8px 14px;font-size:12.5px;color:#5a4b00;text-align:center}
.tb{display:flex;gap:8px;margin:8px 0}.tb button{flex:1;margin:0}
.msg{background:#fde4e4;color:#b42318;border-radius:12px;padding:12px;font-weight:700;text-align:center;margin:8px 0}
</style></head><body>
<div class="demo">نسخة تجربة: بيانات وهمية ومفيش اتصال بالنظام الحقيقي. الأوردرات هنا مش حقيقية.</div>
<main>
<div class="row" style="margin:12px 0 4px"><h2 style="margin:0">أوردرات جاية <span class="pill w" style="font-size:12px" id="n">5</span></h2><span class="pill g">متاح</span></div>
<div class="tb"><button class="btn sm2" onclick="init()">إعادة التشغيل</button><button class="btn sm2" onclick="newOrder()">أوردر جديد (صوت واهتزاز)</button></div><div class="tb"><button class="btn sm2" onclick="takeTest()">جرّب: مندوب تاني قبلني</button></div>
<div id="msg"></div><div id="list"></div></main>
<div class="sheet" id="sh"><div><h2 style="margin-top:0" id="sht">قدّم عرضك</h2><div class="row"><span class="pill y" id="shc"></span><span>الوقت المتبقي</span></div>
<div class="row" style="margin-top:12px"><span style="font-weight:700">جنيه</span><input id="bd" inputmode="numeric" placeholder="حط عرضك"></div><div class="err" id="er"></div>
<button class="btn y" onclick="sendBid()">ابعت العرض</button><button class="btn" onclick="closeSheet()">إلغاء</button></div></div>
<script>
const LIFE=90,EXT=20;const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SH=[["صيدلية النور",5,"0.8","الجامع، شارع البحر، عمارة 12، الدور الأول","شارع الجلاء، برج السلام، شقة 5",250],
["مطعم الشرق",4,"1.4","حي الشرق، شارع المحطة، بجوار الصيدلية","كفر البطيخ، شارع المدرسة، منزل 7",120],
["سوبر ماركت الأمل",3,"1.9","شارع النيل، أمام كوبري الشاطئ","عزبة البرج، الشارع الرئيسي، محل 3",340],
["بوتيك لمسة",4.5,"2.6","وسط البلد، شارع 23 يوليو","راس البر، شارع الكورنيش، عمارة 4",90],
["محل الفجر",2.5,"3.8","المنطقة الصناعية، مصنع 9","دمياط الجديدة، الحي الثالث، عمارة 20",400]];
const EL=[70,50,35,20,5];let O=[],ID=0,SHEET=null,TAKEN=false;
const A=x=>String(x).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function stars(x){let o='';for(let i=0;i<5;i++){const f=Math.max(0,Math.min(1,x-i));o+='<i>★<u style="width:'+Math.round(f*100)+'%">★</u></i>'}return '<span class="st">'+o+'</span>'}
function mk(r,el){return {id:++ID,name:r[0],stars:r[1],km:r[2],a:r[3],b:r[4],gv:r[5],t0:Date.now()-el*1000,bid:null,ext:0,sheetSince:0}}
function init(){O=SH.map((r,i)=>mk(r,EL[i]));ID=O.length;msg('');render()}
function msg(t){document.getElementById('msg').innerHTML=t?'<div class="msg">'+t+'</div>':''}
function left(o){return LIFE+o.ext-(Date.now()-o.t0)/1000}
function render(){document.getElementById('n').textContent=A(O.length);
 document.getElementById('list').innerHTML=O.map(o=>{const cmp=!!o.bid;
 const head='<div class="oh"><b>'+o.name+' '+stars(o.stars)+'</b><span class="km">'+A(o.km)+' كم</span></div>';
 let body='<div class="ob"><p>'+o.a+'<br>← '+o.b+'</p>';
 if(cmp)body+='<div style="margin-top:8px"><span class="pill" style="background:#ffd400;color:#0b0b0b;font-size:12.5px;display:block;text-align:center;border-radius:12px">تم تقديم عرضك في انتظار رد المحل</span><span class="sm" style="display:block;margin-top:6px">قيمة الأوردر '+A(o.gv)+' ج - عرضك '+A(o.bid)+' ج</span></div><div class="act"><button class="bb" style="background:#ffd400" onclick="openSheet('+o.id+')"><span>عدّل عرضك</span></button><button class="rj" onclick="rej('+o.id+')">رفض</button></div></div>';
 else body+='<span class="sm" style="display:block;margin-top:6px">قيمة الأوردر '+A(o.gv)+' ج</span><div class="act"><span class="pill y cnt" id="c'+o.id+'"></span><button class="bb" onclick="openSheet('+o.id+')"><span class="f" id="f'+o.id+'"></span><span>قدّم عرضك</span></button><button class="rj" onclick="rej('+o.id+')">رفض</button></div></div>';
 return '<div class="oc'+(cmp?' cmp':'')+'" id="o'+o.id+'">'+head+body+'</div>'}).join('');tick()}
function tick(){let ch=false;for(const o of O.slice()){if(o.bid)continue;const l=left(o);
  if(SHEET==o.id){if(l<=-EXT){SHEET=null;document.getElementById('sh').classList.remove('on');O=O.filter(x=>x!==o);msg('الوقت خلص');ch=true;continue}}
  else if(l<=0){O=O.filter(x=>x!==o);ch=true;continue}
  const f=document.getElementById('f'+o.id),c=document.getElementById('c'+o.id);
  const p=Math.min(100,Math.max(0,(Date.now()-o.t0)/10/LIFE));
  if(f)f.style.width=(RM?Math.floor(p):p)+'%';if(c){c.textContent=A(Math.max(0,Math.ceil(l)))+' ث';c.className='pill cnt '+(l<=20?'r':'y')}}
 const o=O.find(x=>x.id==SHEET);if(SHEET&&o){document.getElementById('shc').textContent=A(Math.max(0,Math.ceil(left(o))))+' ث'}
 if(ch)render()}
function openSheet(id){const o=O.find(x=>x.id==id);if(!o)return;SHEET=id;o.sheetSince=Date.now();
 msg('')
 document.getElementById('sht').textContent=o.bid?'عدّل عرضك':'قدّم عرضك';document.getElementById('bd').value=o.bid||'';document.getElementById('er').textContent='';document.getElementById('sh').classList.add('on')}
function closeSheet(){const o=O.find(x=>x.id==SHEET);SHEET=null;document.getElementById('sh').classList.remove('on');if(o&&!o.bid&&left(o)<=0){O=O.filter(x=>x!==o);render()}}
function sendBid(){const o=O.find(x=>x.id==SHEET);const v=parseInt(document.getElementById('bd').value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
 if(!v||v<=0){document.getElementById('er').textContent='اكتب مبلغ صحيح';return}
 if(o&&o.id==O[O.length-1].id&&!o.bid&&false){}
 if(TAKEN){TAKEN=false;SHEET=null;document.getElementById('sh').classList.remove('on');O=O.filter(x=>x!==o);msg('قام مندوب آخر بقبول العرض. أوردرات تانية في انتظارك');render();return}
 o.bid=v;SHEET=null;document.getElementById('sh').classList.remove('on');render()}
function takeTest(){TAKEN=true;msg('افتح أي أوردر وابعت عرض، وهيظهر إن مندوب تاني سبقك')}
function rej(id){O=O.filter(x=>x.id!=id);render()}
function newOrder(){const r=SH[Math.floor(Math.random()*SH.length)];O.push(mk(r,0));render();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
 try{const c=new(window.AudioContext||window.webkitAudioContext)();[880,1175].forEach((f,i)=>{const os=c.createOscillator(),g=c.createGain();os.frequency.value=f;os.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.18+.16);os.start(c.currentTime+i*.18);os.stop(c.currentTime+i*.18+.17)})}catch(e){}}
init();setInterval(tick,RM?1000:200);
</script></body></html>
