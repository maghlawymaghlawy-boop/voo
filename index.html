<style>
:root{--y:#ffd400;--k:#0b0b0b;--g:#6b6b6b;--l:#f4f4f2;--b:#e6e6e2;--r:#d83a3a;--ok:#1e9e5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#e9e9e6;font-family:"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,Arial,sans-serif;color:var(--k)}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#fff;position:relative;display:flex;flex-direction:column}
main{flex:1;padding:18px 18px 96px}
h1{font-size:26px;margin:8px 0 6px;line-height:1.35}h2{font-size:20px;margin:18px 0 10px}h3{margin:0;font-size:16px}
p{margin:0;color:var(--g);line-height:1.7;font-size:14px}.sm{font-size:12px;color:var(--g)}
.btn{display:block;width:100%;border:2px solid var(--k);background:#fff;color:var(--k);font:inherit;font-weight:700;font-size:17px;padding:15px;border-radius:14px;cursor:pointer;text-align:center;margin-top:12px}
.btn.y{background:var(--y);border-color:var(--y)}.btn.k{background:var(--k);color:#fff}.btn.sm2{padding:10px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}.btn.red{border-color:var(--r);color:var(--r)}
label{display:block;font-weight:700;margin:16px 0 8px;font-size:15px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:14px;border:1.5px solid var(--b);background:var(--l);border-radius:14px;outline:none}
input:focus,textarea:focus{border-color:var(--k);background:#fff}
.card{border:1.5px solid var(--b);border-radius:18px;padding:14px;margin:10px 0;background:#fff}
.card.sel{border-color:var(--k)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;background:var(--k);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.pill.y{background:var(--y);color:var(--k)}.pill.w{background:#fff3c4;color:#6a5600}.pill.r{background:#fde4e4;color:var(--r)}.pill.g{background:#dff5e8;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{border:1.5px solid var(--b);border-radius:16px;text-align:center;padding:14px 4px}.stat b{font-size:26px;display:block}.stat span{font-size:12px;color:var(--g)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--b);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav a{flex:1;text-align:center;font-size:12px;color:var(--g);padding:6px;font-weight:700;cursor:pointer}nav a.on{color:var(--k)}nav a i{display:block;font-style:normal;font-size:20px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg div{flex:1;min-width:70px;text-align:center;padding:13px 6px;border:1.5px solid var(--b);border-radius:14px;font-weight:700;cursor:pointer}.seg div.on{background:var(--k);color:#fff;border-color:var(--k)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.toggle{background:var(--k);color:#fff;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer}
.sw{width:46px;height:26px;border-radius:99px;background:#555;position:relative}.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--y)}.sw.on::after{right:23px}
.dark{background:var(--k);color:#fff;border-radius:20px;padding:22px;text-align:center}.dark b{display:block;color:var(--y);font-size:40px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--b);font-size:14px}.kv:last-child{border:0}.gv{background:#fff8d6;border:1.5px solid var(--y);border-radius:14px;padding:10px 12px;margin:8px 0;font-weight:700;font-size:14px}.kv.gv{border-radius:0;margin:0 -14px;padding:10px 14px;border-left:0;border-right:0}.kv.st{flex-wrap:wrap}.kv.st>span{white-space:normal;min-width:0}.kv.st>span:last-child{flex:1;text-align:left}.kv span{color:var(--g);white-space:nowrap}.kv b{text-align:left}

.map{height:200px;border-radius:18px;background:#eef0ea;position:relative;overflow:hidden;border:1.5px solid var(--b)}
.err{color:var(--r);font-size:13px;margin-top:8px;min-height:18px}.note{background:#fff8d6;border:1.5px solid #f0e08a;border-radius:14px;padding:12px;font-size:13px;margin:12px 0;color:#5a4b00}
.hero{text-align:center;padding-top:10px}.hero img{width:210px}.feat{display:flex;gap:12px;align-items:center}.feat i{width:42px;height:42px;border-radius:12px;background:var(--y);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;flex:none}
.stars{color:#e0a800;letter-spacing:2px}.star{font-size:34px;color:#ccc;cursor:pointer}.star.on{color:#e0a800}
.demo{font-size:12px;color:var(--g);background:var(--l);border-radius:12px;padding:10px;margin-top:14px;line-height:1.8}

.mini{padding:9px 12px;margin:7px 0;border-radius:14px}.mini .row{gap:8px}.mini b.id{font-size:14px;white-space:nowrap}.mini .ln{font-size:12.5px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;line-height:1.5}.mini .pill{font-size:11px;padding:3px 9px}

.dueC{background:var(--k);color:#fff;border-radius:18px;padding:18px;margin:12px 0;cursor:pointer}.dueC small{color:#cfcfcf;font-size:13px}.dueC b{font-size:34px;display:block;margin:4px 0}.dueC .bar{height:10px;background:#444;border-radius:9px;overflow:hidden;margin:10px 0 4px}.dueC .bar i{display:block;height:100%;background:var(--y)}.dueC.dis{cursor:default}.stp{display:flex;gap:12px;align-items:flex-start;margin:11px 0;font-size:15px;line-height:1.6}.stp i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--y);font-style:normal;font-weight:800;text-align:center;line-height:28px}.amtb{background:#fff8cc;border:2px dashed var(--k);border-radius:14px;text-align:center;padding:12px;font-size:30px;font-weight:800;margin:8px 0}.rcp{width:100%;border-radius:14px;border:1.5px solid var(--b);margin:8px 0;max-height:60vh;object-fit:contain;background:#f4f4f4}.warn{background:#ffe9e9;border:1.5px solid #f2b3b3;border-radius:14px;padding:12px;font-size:14px;margin:12px 0;color:#7a1010;font-weight:700}.gm{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}.gm a{flex:1;min-width:150px;margin-top:0;text-decoration:none}

 .hero img{width:240px}
 .lmap{height:520px}.geo iframe{height:320px}
 .gm a{flex:0 1 auto;min-width:220px}
 .sheet{align-items:center}.sheet>div{border-radius:22px;max-width:520px}
 h1{font-size:30px}

.vnote{position:absolute;top:62px;left:10px;right:10px;z-index:500;font-size:12px;color:#5a4600;text-align:center}.vnote:empty{display:none}.vnote{background:#fff8d6;border-radius:12px;padding:6px 10px}

#vmtoast{position:absolute;top:100px;left:20px;right:20px;z-index:700;background:#0b0b0b;color:#fff;border-radius:12px;padding:10px;text-align:center;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}#vmtoast.on{opacity:1}
.vp{width:26px;height:26px;border-radius:50%;background:#ffd400;border:3px solid #0b0b0b;position:relative;box-sizing:border-box}.vp:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid #ffd400;animation:vpl 1.3s ease-out infinite}.vp.sel{background:#0b0b0b;border-color:#ffd400}@keyframes vpl{from{transform:scale(.55);opacity:.9}to{transform:scale(1.4);opacity:0}}

.mapbtn{margin:6px 0 0;padding:10px;font-size:14px}

<script>
const $=s=>document.querySelector(s);const LOGO=(document.querySelector('#splash img')||{}).src||'';
const AR='٠١٢٣٤٥٦٧٨٩';const n=x=>String(x).replace(/\d/g,d=>AR[d]);
const VEH={moto:'موتوسيكل',car:'عربية ملاكي',truck:'عربية نقل'};
const ERR={value_required:'اكتب قيمة الأوردر (تمن البضاعة)',too_many:'محاولات كتير غلط. جرّب بعد ١٥ دقيقة',suspended:'الحساب ده موقوف',forbidden:'ملكش صلاحية على الإجراء ده',bad_old_pw:'كلمة السر الحالية غلط',bad_username:'اسم المستخدم إنجليزي (حروف وأرقام) من ٣ لـ ٣٠',username_taken:'اسم المستخدم ده مستخدم',bad_value:'القيمة مش مظبوطة',pick_one:'اختار شخص واحد',pick_some:'اختار شخص على الأقل',bad_link:'اللينك لازم يبدأ بـ https://',bad_ipa:'اكتب عنوان إنستاباي',bad_login:'الرقم أو كلمة السر غلط',phone_taken:'الرقم ده مسجل قبل كده',bad_phone:'رقم الموبايل لازم يكون ١١ رقم ويبدأ بـ ٠١',weak_password:'كلمة السر لازم ٤ أحرف على الأقل',name_required:'اكتب الاسم',docs_required:'لازم ترفع الأوراق التلاتة',docs_too_big:'الصور كبيرة، جرّب صور أصغر',not_logged_in:'سجّل دخولك الأول',limit_reached:'وصلت للحد الأقصى من الأوردرات',order_unavailable:'الأوردر ده لم يعد متاح',wrong_code:'الكود غلط',not_approved:'حسابك لسه قيد المراجعة',wrong_vehicle:'الأوردر ده لمركبة تانية',missing_fields:'كمّل العنوان والتفاصيل والسعر',cannot_republish:'مينفعش ترفعه تاني',vmodel_required:'اكتب نوع وموديل المركبة',vnum_required:'اكتب رقم المركبة',vphotos_required:'لازم ترفع صورتين للمركبة',cname_required:'اكتب اسم العميل',bad_cphone:'رقم موبايل العميل لازم يكون ١١ رقم ويبدأ بـ ٠١',account_closed:'حسابك مقفول لحد ما تسدد مستحقات voo',pending_exists:'عندك إيصال قيد المراجعة بالفعل',nothing_due:'مفيش مستحقات عليك',bad_receipt:'الصورة مش مقبولة، جرّب صورة تانية أو أصغر',forbidden:'مش مسموح',already_reviewed:'الإيصال ده اتراجع قبل كده',not_found:'مش موجود',bad_amount:'اكتب مبلغ صحيح'};
let T=localStorage.getItem('voo.token')||null;
let S={me:null,orders:[],off:0};
let _jwt=null,_jwtExp=0;
async function anonToken(){
  if(!VOO.AUTH)return VOO.KEY||'';
  if(_jwt&&Date.now()<_jwtExp-60000)return _jwt;
  const r=await fetch(VOO.AUTH+'/token/anonymous');if(!r.ok)throw new Error('مفيش اتصال، جرّب تاني');
  const j=await r.json();_jwt=j.token;_jwtExp=j.expires_at*1000;return _jwt}
async function rpc(fn,args){
  let r;try{const tk=await anonToken();
  r=await fetch(VOO.API+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},tk?{Authorization:'Bearer '+tk}:{},VOO.KEY?{apikey:VOO.KEY}:{}),body:JSON.stringify(args||{})})}catch(e){throw new Error('مفيش اتصال، جرّب تاني')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(j.message||'').trim();const e=new Error(ERR[m]||(m?'حصلت مشكلة: '+m:'مفيش اتصال، جرّب تاني'));e.code=m;throw e}
  return j}
async function refresh(){
  if(!T){S.me=null;S.orders=[];return}
  try{const j=await rpc('api_state',{p_token:T});S.me=j.me;S.orders=j.orders;S.due=j.due;S.notes=j.notes||[];S.off=j.now-Date.now()}
  catch(e){if(e.code=='not_logged_in'){T=null;localStorage.removeItem('voo.token');S.me=null}}}
const now=()=>Date.now()+S.off;
const me=()=>S.me;
const OID=id=>S.orders.find(o=>String(o.id)==String(id));
const money=x=>n(x)+' جنيه';
const fmt=s=>{s=Math.max(0,Math.ceil(s));return n(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'))};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let route=location.hash.slice(1)||'landing',sheet=null,form={},busy=false;
function go(r){route=r;sheet=null;location.hash=r;render()}
window.onhashchange=()=>{const r=location.hash.slice(1)||'landing';if(r!==route){route=r;sheet=null;render()}};
async function act(fn,args,after){if(busy)return;busy=true;try{const r=await rpc(fn,Object.assign({p_token:T},args));await refresh();busy=false;return after?after(r):render()}catch(e){busy=false;const el=$('#er');if(el)el.textContent=e.message;else alert(e.message);return null}}
const STAT={open:['بيستنى عروض','w'],matched:['المندوب وصل','y'],picked:['في الطريق للعميل','y'],delivered:['اتسلّم','g'],failed:['فشل التسليم','r'],expired:['خلص الوقت','r']};
const pill=o=>`<span class="pill ${STAT[o.status][1]}">${STAT[o.status][0]}</span>`;
const active=()=>S.orders.filter(o=>o.status=='matched'||o.status=='picked');
function nav(items,cur){return `<nav>${items.map(i=>`<a class="${cur==i[0]?'on':''}" onclick="go('${i[0]}')"><i>${i[2]}</i>${i[1]}</a>`).join('')}</nav>`}
const homeOf=u=>u.role=='shop'?'shop':u.role=='courier'?'cour':'adm';
const RN=[['rev','المراجعات','✔'],['rev/team','الفريق','◉']];
const SN=[['shop','الرئيسية','⌂'],['shop/new','أوردر جديد','＋'],['shop/orders','أوردراتي','▣'],['shop/me','حسابي','◉']];
const CN=[['cour','الرئيسية','⌂'],['cour/mine','أوردراتي','▣'],['cour/me','حسابي','◉']];
function render(){
 if(route.startsWith('t/')){$('#m').innerHTML='<div class="authbox wide">'+trackView(route.slice(2))+'</div>';$('#nv').innerHTML='';document.querySelectorAll('#sh').forEach(e=>e.remove());setTimeout(initMaps,50);return}
 const u=me();let r=route;
 if(r.startsWith('shop')&&!(u&&u.role=='shop'))r='login';
 if(r.startsWith('cour')&&!(u&&u.role=='courier'))r='login';
 if(r.startsWith('adm')&&!(u&&u.role=='staff'))r='login';
 if(r.startsWith('rev')&&!(u&&PM('reviews')>0))r='login';
 if(u&&['landing','login','register'].includes(r.split('/')[0]))r=homeOf(u);
 const [p,a]=r.split('/');let h='',nv='';
 if(r=='landing')h=landing();else if(r=='login')h=login();else if(p=='register')h=register(a);
 else if(p=='shop'){h=shopView(a,r);nv=nav(SN,a?(a=='o'?'shop/orders':r):'shop')}
 else if(p=='cour'){h=courView(a,r);nv=nav(CN,a=='o'?'cour':r)}
 else if(p=='adm'){h=admView(a,r);nv=u.must_pw?'':nav(admNav(),r=='adm'?'adm':r.startsWith('adm/set')||r.startsWith('adm/staff')?'adm/set/courier':r=='adm/me'?'adm/me':'adm')}
 else if(p=='rev'){h=(u.role=='staff'&&u.must_pw)?pwView(true):revView(a,r);nv=u.role=='staff'?(u.must_pw?'':nav(admNav(),'rev')):nav(u.role=='shop'?SN:CN,u.role=='shop'?'shop/me':'cour/me')}
 else h=landing();
 $('#m').innerHTML=banners()+(G.err&&me()&&me().role!='staff'?`<div class="note" id="geoerr" onclick="G.err='';startGeo();render()">${G.err} (دوس هنا وجرّب تاني)</div>`:'')+h;$('#nv').innerHTML=nv;
 document.querySelectorAll('#sh').forEach(e=>e.remove());
 if(sheet)document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="sh" onclick="if(event.target.id=='sh'){sheet=null;render()}"><div>${sheet}</div></div>`);
 {const p=document.getElementById('lm');if(p&&LMAP&&LMAP._container!==p&&!LMAP._container.isConnected&&LMAP._container.dataset.mode==p.dataset.mode&&LMAP._container.dataset.oid==p.dataset.oid){p.replaceWith(LMAP._container);try{LMAP.invalidateSize(false)}catch(e){}const li=document.getElementById('lmi');if(li&&LTXT)li.innerHTML=LTXT}}

 if(a=='done'&&PF&&PF.done)return admHead('تم إنشاء الموظف',null,'adm/staff')+`<div class="card"><div class="kv"><span>اسم المستخدم</span><b dir="ltr">${esc(PF.done.un)}</b></div><div class="kv"><span>كلمة السر المؤقتة</span><b dir="ltr">${esc(PF.done.pw)}</b></div></div><p class="sm">ادّيهم للموظف دلوقتي. كلمة السر دي مش هتظهر تاني، والموظف هيغيّرها أول دخول.</p><button class="btn y" onclick="PF=null;go('adm/staff')">تمام</button>`;
 if(a=='e'){const L=aload('staff','api_staff_list');if(!L)return admHead('موظف',null,'adm/staff')+'<p>بنحمّل...</p>';const x=(L.err?[]:L).find(s=>s.id==id);if(!x)return admHead('موظف',null,'adm/staff')+'<p>مش موجود.</p>';
  if(!PF||PF.id!=id)PF={id,perms:Object.assign({},x.perms),status:x.status};
  return admHead(esc(x.name),'اسم المستخدم: '+esc(x.username||''),'adm/staff')+`<h3>الأقسام المسموحة</h3>${permGrid()}<div class="err" id="er"></div><button class="btn y" onclick="saveStaff('${id}')">حفظ الصلاحيات</button><button class="btn" onclick="sheet=resetSheet('${id}');render()">ريسيت كلمة السر</button><button class="btn ${PF.status=='suspended'?'':'red'}" onclick="toggleStaff('${id}')">${PF.status=='suspended'?'إعادة تفعيل الحساب':'إيقاف الحساب'}</button>`}
 const L=aload('staff','api_staff_list');
 return admHead('الموظفين',null,'adm')+`<button class="btn y" onclick="PF=null;go('adm/staff/new')">+ موظف جديد</button>`+(!L?'<p>بنحمّل...</p>':L.err?'<p>'+esc(L.err)+'</p>':L.map(x=>`<div class="card mini" ${x.owner?'':`onclick="PF=null;go('adm/staff/e/${x.id}')"`}><div class="row"><span class="pill ${x.owner?'':ST[x.status][1]}">${x.owner?'مالك':ST[x.status][0]}</span><h3>${esc(x.name)}</h3></div><p class="sm">${x.owner?'كل الصلاحيات':Object.keys(x.perms||{}).map(k=>SECN[k]+' ('+(x.perms[k]==2?'تعديل':'عرض')+')').join(' · ')||'من غير أقسام'}${x.must_pw?' · لسه مغيّرش كلمة السر':''}</p></div>`).join(''))}
async function createStaff(){readStaffForm();try{await A('api_staff_create',{p_name:PF.nm,p_username:PF.un,p_pw:PF.pw,p_perms:PF.perms});PF={done:{un:PF.un.toLowerCase().trim(),pw:PF.pw}};areset();go('adm/staff/done')}catch(e){aerr(e)}}
async function saveStaff(id){try{await A('api_staff_update',{p_id:id,p_perms:PF.perms,p_status:PF.status});areset();PF=null;go('adm/staff')}catch(e){aerr(e)}}
function toggleStaff(id){PF.status=PF.status=='suspended'?'approved':'suspended';saveStaff(id)}
function resetSheet(id){return `<h2 style="margin-top:0">ريسيت كلمة السر</h2><p class="sm">اكتب كلمة سر مؤقتة جديدة. الموظف هيغيّرها أول دخول وأي جلسة مفتوحة هتتقفل.</p><label>كلمة السر المؤقتة</label><input id="rp" dir="ltr" style="text-align:right" value="${genPw()}"><div class="err" id="er"></div><button class="btn y" onclick="doReset('${id}')">حفظ</button><button class="btn" onclick="sheet=null;render()">إلغاء</button>`}
async function doReset(id){const p=$('#rp').value;try{await A('api_staff_reset',{p_id:id,p_pw:p});areset();sheet=`<h2 style="margin-top:0">تم</h2><p>كلمة السر المؤقتة الجديدة: <b dir="ltr">${esc(p)}</b></p><p class="sm">ادّيها للموظف دلوقتي، مش هتظهر تاني.</p><button class="btn y" onclick="sheet=null;go('adm/staff')">تمام</button>`;render()}catch(e){aerr(e)}}

// ===== courier map (single instance, in-place updates) =====
const VM={open:false,m:null,focus:null,sel:null,mk:{},me:null,ring:null,cl:null,touched:false,fitted:false,card:'',toast:null};
const radKm=()=>+(S.me&&S.me.map_radius)||3;
function dkm(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
const kmTxt=x=>n(+x.toFixed(1))+' كم';
const vpIcon=s=>L.divIcon({className:'',html:`<div class="vp${s?' sel':''}"></div>`,iconSize:[26,26],iconAnchor:[13,13]});
function openMap(oid){
 if(!window.L){toast_('الخريطة لسه بتحمّل، جرّب كمان ثانية');return}
 if(VM.open)closeMap();
 if(typeof startGeo=='function')startGeo();
 VM.open=true;VM.focus=oid||null;VM.sel=oid||null;VM.touched=false;VM.fitted=false;VM.mk={};VM.me=null;VM.ring=null;VM.cl=null;VM.card='';
 const d=document.createElement('div');d.id='vm';
 d.innerHTML=`<div id="vmm"></div><div class="vtop"><b id="vmt">أوردرات قريبة</b><span id="vmr"></span><a onclick="closeMap()" class="vx">✕</a></div><div id="vmn" class="vnote"></div><a class="vrc" onclick="vmRecenter()">⌖ إعادة التمركز</a><div id="vmc"></div><div id="vmtoast"></div>`;
 document.body.appendChild(d);
 const m=VM.m=L.map('vmm',{zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(m);m.setView([31.42,31.81],13);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
 VM.cl=L.layerGroup().addTo(m);
 const el=document.getElementById('vmm');['pointerdown','wheel','touchstart','dblclick'].forEach(ev=>el.addEventListener(ev,()=>{VM.touched=true},{passive:true}));
 vmSync();vmSel(VM.sel,true);vmFit();
}
function closeMap(){if(!VM.open)return;VM.open=false;try{VM.m.remove()}catch(e){}VM.m=null;const d=document.getElementById('vm');if(d)d.remove();VM.mk={};VM.me=null;VM.ring=null}
function vmFit(){if(!VM.m)return;const m=VM.m,pts=[];
 if(VM.focus){const o=OID(VM.focus);if(o&&o.pin){if(o.pin.s)pts.push([o.pin.s.lat,o.pin.s.lng]);if(o.pin.d)pts.push([o.pin.d.lat,o.pin.d.lng])}if(G.pos)pts.push([G.pos.lat,G.pos.lng])}
 if(pts.length>1){m.fitBounds(pts,{padding:[50,50],maxZoom:16});VM.fitted=true;return}
 if(pts.length==1){m.setView(pts[0],15);VM.fitted=true;return}
 if(G.pos){m.fitBounds(L.latLng(G.pos.lat,G.pos.lng).toBounds(radKm()*2000),{padding:[20,20]});VM.fitted=true}}
function vmRecenter(){VM.touched=false;vmFit()}
function vmMe(){if(!VM.open||!VM.m)return;const p=G.pos;const nn=document.getElementById('vmn');
 if(!p){if(nn)nn.textContent=G.err||'لسه مستني موقعك (GPS). الأوردرات هتظهر كلها لحد ما يظهر.';return}
 if(nn)nn.textContent='';
 const ll=[p.lat,p.lng];
 if(!VM.me){VM.me=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="vme"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(VM.m);VM.ring=L.circle(ll,{radius:radKm()*1000,color:'#2563eb',weight:2,dashArray:'6 6',fillOpacity:.04,interactive:false}).addTo(VM.m)}
 else{VM.me.setLatLng(ll);VM.ring.setLatLng(ll);if(VM.ring.getRadius()!=radKm()*1000)VM.ring.setRadius(radKm()*1000)}
 if(!VM.fitted&&!VM.touched)vmFit()}
function vmToast(t){const e=document.getElementById('vmtoast');if(!e)return;e.textContent=t;e.className='on';clearTimeout(VM.toast);VM.toast=setTimeout(()=>{e.className=''},3500)}
function vmSync(){if(!VM.open||!VM.m)return;
 const r=radKm(),me=G.pos,list=S.orders.filter(o=>o.status=='open'&&o.pin&&o.pin.s);
 const vis=list.filter(o=>o.id==VM.focus||o.id==VM.sel||!me||dkm(me,o.pin.s)<=r),ids=new Set(vis.map(o=>o.id));
 for(const o of vis)if(!VM.mk[o.id]){const mk=L.marker([o.pin.s.lat,o.pin.s.lng],{icon:vpIcon(o.id==VM.sel)}).addTo(VM.m);const id=o.id;mk.on('click',()=>vmSel(id));VM.mk[o.id]=mk}
 for(const id in VM.mk)if(!ids.has(+id)){VM.m.removeLayer(VM.mk[id]);delete VM.mk[id]}
 const t=document.getElementById('vmt');if(t)t.textContent='أوردرات قريبة ('+n(ids.size)+')';const rr=document.getElementById('vmr');if(rr)rr.textContent='نطاق '+n(r)+' كم';
 if(VM.sel){const o=OID(VM.sel);if(!o||o.status!='open'){const was=VM.sel;vmSel(null);vmToast('الأوردر ده اتاخد أو انتهى وشلناه من الخريطة')}else vmCard()}
 vmMe()}
function vmSel(id,quiet){const old=VM.sel;VM.sel=id;
 if(old&&VM.mk[old])VM.mk[old].setIcon(vpIcon(false));if(id&&VM.mk[id])VM.mk[id].setIcon(vpIcon(true));
 if(VM.cl)VM.cl.clearLayers();
 if(id){const o=OID(id);if(o&&o.pin&&VM.cl){const s=o.pin.s,dd=o.pin.d;
   if(dd){L.circle([dd.lat,dd.lng],{radius:dd.exact?40:300,color:'#d83a3a',weight:2,fillOpacity:.15,interactive:false}).addTo(VM.cl);L.marker([dd.lat,dd.lng],{icon:L.divIcon({className:'',html:'<div class="vcu">عميل</div>',iconSize:[40,22],iconAnchor:[20,11]}),interactive:false}).addTo(VM.cl);
    if(s)L.polyline([[s.lat,s.lng],[dd.lat,dd.lng]],{color:'#0b0b0b',weight:3,dashArray:'8 6',interactive:false}).addTo(VM.cl)}}}
 VM.card='';vmCard()}
function vmCard(){const c=document.getElementById('vmc');if(!c)return;const o=VM.sel&&OID(VM.sel);
 if(!o){if(c.innerHTML){c.innerHTML=''}VM.card='';return}
 const me=G.pos,p=o.pin||{},dm=me&&p.s?kmTxt(dkm(me,p.s)):null,dc=p.s&&p.d?kmTxt(dkm(p.s,p.d)):null;
 const q=encodeURIComponent((p.s?p.s.lat+','+p.s.lng:o.shop.addr||o.shop.name));
 const h=`<div class="vch"><b>أوردر #${n(o.id)} · ${esc(o.shop.name)}</b><a onclick="vmSel(null)" class="vx2">✕</a></div>
 <p class="sm">${esc(o.details)}${o.vehicle&&o.vehicle!='any'&&VEH[o.vehicle]?' · '+VEH[o.vehicle]:''}</p>
 <div class="vl"><span>الاستلام</span><b>${esc(o.shop.addr||o.shop.name)}${dm?` · ${dm} منك`:''}</b></div>
 <div class="vl"><span>التسليم</span><b>${esc(o.address)}${dc?` · ${dc} من المحل (تقريبًا)`:''}</b></div>
 ${o.goods_value?`<div class="gv">💰 قيمة الأوردر ${money(o.goods_value)} · هتدفعها للمحل</div>`:''}
 <div class="vl"><span>الدفع</span><b>${esc(o.pay)}</b></div>
 ${p.d&&!p.d.exact?'<p class="sm">مكان العميل تقريبي لحد ما تقبل الأوردر</p>':!p.d?'<p class="sm">مكان العميل مش متحدد على الخريطة، شوف العنوان المكتوب</p>':''}
 <div class="vb"><span class="pill" data-exp="${o.expires_at}">${fmt((o.expires_at-now())/1000)}</span><a class="btn y sm2" onclick="vmBid(${o.id})">قدّم عرض سعر</a><a class="btn sm2" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${q}">المسار</a></div>`;
 const key=h.replace(/data-exp="\d+">[^<]*/,'');if(VM.card===key)return;VM.card=key;c.innerHTML=h}
function vmBid(id){closeMap();go('cour/o/'+id)}
function showOnMap(id){const o=OID(id);if(o&&o.pin&&(o.pin.s||o.pin.d))openMap(id);else{const q=encodeURIComponent((o.shop.addr||o.shop.name)+' ، '+o.address);window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener')}}
function toast_(t){alert(t)}

// live
setInterval(()=>{document.querySelectorAll('[data-up]').forEach(e=>{e.textContent=fmt((now()-e.dataset.up)/1000)});document.querySelectorAll('[data-exp]').forEach(e=>{e.textContent=fmt((e.dataset.exp-now())/1000)});
 },1000);
setInterval(async()=>{if(!T||busy||sheet||document.hidden)return;const f=document.activeElement;if(f&&/INPUT|TEXTAREA/.test(f.tagName))return;const sg=()=>JSON.stringify(S.orders,(k,v)=>(k=='cloc'||k=='sp'||k=='sloc'||k=='pin')?(v?1:0):v)+JSON.stringify(S.me)+JSON.stringify(S.due)+JSON.stringify(S.notes);const before=sg();await refresh();if(VM.open){vmSync();return}if(document.getElementById('lm'))initMaps();if(sg()!==before||document.querySelector('[data-exp]')&&S.orders.some(o=>o.status=='open'&&o.expires_at<now()))render()},3000);
(async()=>{if(!route.startsWith('t/'))await refresh();if(S.me&&S.me.role!='staff')startGeo();render();setTimeout(()=>{const s=$('#splash'),i=s.querySelector('img');i.style.animation='none';i.getBoundingClientRect();i.classList.add('go');setTimeout(()=>s.remove(),900)},1300)})();
</script></body></html>
